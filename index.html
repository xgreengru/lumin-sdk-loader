<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Game Hub</title>

<style>
:root{
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.15);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.6);
  --accent:#0a84ff;
}

/* ===== GLOBAL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

body{
  height:100vh;
  background: radial-gradient(circle at top, #1a1f35, #0b0d14 70%);
  color:var(--text);
  overflow:hidden;
}

/* ===== GLASS EFFECT ===== */
.glass{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius:20px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.2);
}

/* ===== HERO ===== */
.hero{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  text-align:center;
}

.hero-card{
  padding:40px 50px;
  animation:float 6s ease-in-out infinite;
}

.hero h1{
  font-size:clamp(2.5rem,5vw,4rem);
  font-weight:600;
  letter-spacing:-0.02em;
}

.hero p{
  color:var(--muted);
  margin-top:10px;
}

/* ===== BUTTON ===== */
.enter-btn{
  margin-top:25px;
  padding:14px 30px;
  border-radius:999px;
  border:none;
  background:rgba(255,255,255,0.15);
  color:white;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  backdrop-filter: blur(10px);
  transition: all .25s ease;
}

.enter-btn:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.25);
}

/* ===== APP ===== */
#app{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  padding:20px;
  gap:15px;
}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
}

.title{
  font-weight:600;
  font-size:1.1rem;
}

.close-btn{
  background:rgba(255,255,255,0.1);
  border:none;
  color:white;
  font-size:1.2rem;
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  transition:.2s;
}

.close-btn:hover{
  background:rgba(255,255,255,0.2);
}

/* ===== LUMIN AREA ===== */
#luminContainer{
  flex:1;
  overflow:hidden;
  border-radius:20px;
}

/* ===== FLOAT ANIMATION ===== */
@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-10px);}
}

/* ===== FADE ===== */
.fade-in{
  animation:fade .4s ease forwards;
}

@keyframes fade{
  from{opacity:0; transform:scale(.98);}
  to{opacity:1; transform:scale(1);}
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-card glass">
    <h1>Game Hub</h1>
    <p>also try download hub</p>
    <button class="enter-btn" id="enterBtn">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar glass">
    <div class="title">Game Hub</div>
    <button class="close-btn" id="closeBtn">×</button>
  </div>

  <div id="luminContainer" class="glass"></div>
</div>

<!-- LUMIN -->
<script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

<script>
const enterBtn = document.getElementById("enterBtn");
const hero = document.getElementById("hero");
const app = document.getElementById("app");
const closeBtn = document.getElementById("closeBtn");

let luminLoaded = false;

/* ENTER */
enterBtn.onclick = () => {
  hero.style.display = "none";
  app.style.display = "flex";
  app.classList.add("fade-in");

  if(!luminLoaded){
    setTimeout(()=>{
      Lumin.init({
        container:"#luminContainer",
        theme:"dark"
      });
      luminLoaded = true;
    },100);
  }
};

/* CLOSE */
closeBtn.onclick = () => {
  app.style.display = "none";
  hero.style.display = "flex";
};
</script>

</body>
</html>
